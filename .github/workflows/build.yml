name: Build & Deploy Book

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-sil-charis fonts-inter fonts-jetbrains-mono

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install mdbook and backends
        run: |
          command -v mdbook || cargo install mdbook
          command -v mdbook-typst-pdf || cargo install mdbook-typst-pdf

      - name: Install forked backends
        run: |
          cargo install --git https://github.com/padamson/mdbook-admonish --branch feat/mdbook-0.5-compat --force
          mdbook-admonish install

      - name: Install mdbook-quiz (requires pnpm for JS assets)
        run: |
          if command -v mdbook-quiz; then
            echo "mdbook-quiz already installed"
          else
            npm install -g pnpm
            git clone --branch feature/mdbook-0.5-support https://github.com/padamson/mdbook-quiz.git /tmp/mdbook-quiz
            cd /tmp/mdbook-quiz
            cargo test -p mdbook-quiz-schema --features ts export_bindings
            mkdir -p js/packages/quiz/src/bindings
            cp crates/mdbook-quiz-schema/bindings/* js/packages/quiz/src/bindings/
            cd js && pnpm install
            cd packages/quiz && pnpm exec tsc && cp src/lib.scss dist
            cd ../quiz-embed && pnpm exec vite build
            cd /tmp/mdbook-quiz && cargo install --path crates/mdbook-quiz
          fi

      - name: Build book (HTML)
        run: mdbook build

      - name: Build PDF
        run: ./build-pdf.sh

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: build/html/

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: "build/typst-pdf/Trunk to Table.pdf"

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: book-pdf

      - name: Create GitHub Release with PDF
        uses: softprops/action-gh-release@v2
        with:
          files: "Trunk to Table.pdf"
          generate_release_notes: true
