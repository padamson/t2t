[package]
name = "mdbook-quiz-pdf"
version = "0.1.0"
edition = "2024"
description = "mdbook preprocessor that renders quiz TOML as styled admonish blocks for non-HTML backends"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
