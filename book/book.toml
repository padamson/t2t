[book]
title = "Trunk to Theory"
authors = ["Paul Adamson"]
language = "en"
src = "src"

[build]
build-dir = "build"

[preprocessor.quiz-pdf]
command = "mdbook-quiz-pdf"
before = ["quiz"]

[preprocessor.quiz]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

[[preprocessor.admonish.custom]]
directive = "reference"
icon = "./images/book-open-variant.svg"
color = "#e8a317"
title = "Reading Assignment"

[[preprocessor.admonish.custom]]
directive = "quiz"
icon = "./images/help-circle.svg"
color = "#7c4dff"
title = "Check Your Understanding"

[preprocessor.listings]
command = "mdbook-listings"
before = ["admonish", "links"]

[output.html]
additional-css = ["./mdbook-admonish.css", "./mdbook-listings.css"]
git-repository-url = "https://github.com/padamson/t2t"
additional-js = ["./mdbook-listings.js"]
